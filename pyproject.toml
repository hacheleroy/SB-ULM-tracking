[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sbulm"
version = "0.10.0"
description = "Controlled benchmarks for posterior sampling of uncertain microbubble trajectories in ULM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Henri Leroy" },
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
tsbm = [
  "accelerate>=1.0",
  "geomloss>=0.2",
  "hydra-core>=1.3",
  "pillow>=10",
  "pot>=0.9",
  "pytorch-lightning>=2.0",
  "torch>=2.2",
  "tqdm>=4.6",
  "wandb>=0.18",
]

[project.scripts]
sbulm-crossing-demo = "sbulm.experiment:main"
sbulm-difficulty-map = "sbulm.difficulty:main"
sbulm-export-smooth-sb = "sbulm.smooth_sb:main"
sbulm-physical-calibration = "sbulm.physical_sweep:main"
sbulm-wp2-likelihood = "sbulm.wp2_likelihood:main"
sbulm-smc-calibration = "sbulm.smc_calibration:main"
sbulm-wp3-null-calibration = "sbulm.wp3_null_calibration:main"
sbulm-wp4-existence-calibration = "sbulm.wp4_existence_calibration:main"
sbulm-wp5-scaling-calibration = "sbulm.wp5_scaling_calibration:main"
sbulm-wp6-paired-scaling = "sbulm.wp6_paired_scaling:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sbulm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

